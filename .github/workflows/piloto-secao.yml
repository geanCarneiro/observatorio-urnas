name: Piloto de coleta de seção

on:
  workflow_dispatch:
    inputs:
      uf:
        description: UF (duas letras)
        type: string
        required: true
        default: es
      municipio:
        description: Código do município
        type: string
        required: true
        default: '56251'
      zona:
        description: Zona eleitoral
        type: string
        required: true
        default: '0054'
      secao:
        description: Seção eleitoral
        type: string
        required: true
        default: '0509'
permissions:
  contents: read

concurrency:
  group: piloto-tse-${{ inputs.uf }}-${{ inputs.municipio }}-${{ inputs.zona }}-${{ inputs.secao }}
  cancel-in-progress: false

jobs:
  coletar-e-extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências do decoder ASN.1
        run: python -m pip install -r requirements.txt
      - name: Coletar manifesto, BU, log e RDV
        id: collect
        env:
          UF: ${{ inputs.uf }}
          MUNICIPIO: ${{ inputs.municipio }}
          ZONA: ${{ inputs.zona }}
          SECAO: ${{ inputs.secao }}
        run: |
          python tools/collect_section.py \
            --uf "$UF" --municipio "$MUNICIPIO" --zona "$ZONA" --secao "$SECAO" \
            --output dados > "$RUNNER_TEMP/coleta.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          x=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'coleta.json')))
          print('section_key='+x['section_key'])
          print('run_dir='+str(pathlib.Path(x['acquisition']).parent))
          PY
      - name: Extrair campos estruturados junto aos arquivos de origem
        run: |
          python tools/extract_section_data.py \
            --acquisition "${{ steps.collect.outputs.run_dir }}/acquisition.json"
      - name: Publicar dados organizados por seção e turno
        uses: actions/upload-artifact@v4
        with:
          name: dados-piloto-${{ inputs.uf }}-${{ inputs.municipio }}-${{ inputs.zona }}-${{ inputs.secao }}
          path: dados/${{ steps.collect.outputs.section_key }}/
          if-no-files-found: error
          retention-days: 90
