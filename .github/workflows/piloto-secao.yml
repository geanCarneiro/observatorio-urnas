name: Piloto de coleta de seção

on:
  workflow_dispatch:
    inputs:
      uf:
        description: UF (duas letras)
        type: string
        required: true
        default: es
      municipio:
        description: Código do município
        type: string
        required: true
        default: '56251'
      zona:
        description: Zona eleitoral
        type: string
        required: true
        default: '0054'
      secao:
        description: Seção eleitoral
        type: string
        required: true
        default: '0509'
permissions:
  contents: read

concurrency:
  group: piloto-tse-${{ inputs.uf }}-${{ inputs.municipio }}-${{ inputs.zona }}-${{ inputs.secao }}
  cancel-in-progress: false

jobs:
  coletar-e-extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências do decoder ASN.1
        run: python -m pip install -r requirements.txt
      - name: Coletar manifesto, BU, log e RDV dos dois turnos
        id: collect
        env:
          UF: ${{ inputs.uf }}
          MUNICIPIO: ${{ inputs.municipio }}
          ZONA: ${{ inputs.zona }}
          SECAO: ${{ inputs.secao }}
        run: |
          for turn_data in "1:3220" "2:3221"; do
            IFS=: read -r TURN DATA_ID <<< "$turn_data"
            python tools/collect_section.py \
              --uf "$UF" --municipio "$MUNICIPIO" --zona "$ZONA" --secao "$SECAO" \
              --data-id "$DATA_ID" --output dados > "$RUNNER_TEMP/coleta-$TURN.json"
            python - "$RUNNER_TEMP/coleta-$TURN.json" "$GITHUB_OUTPUT" "$TURN" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              print(f"section_key={result['section_key']}", file=output)
              print(f"acquisition_{sys.argv[3]}={result['acquisition']}", file=output)
          PY
          done
      - name: Extrair campos estruturados dos dois turnos
        run: |
          python tools/extract_section_data.py \
            --acquisition "${{ steps.collect.outputs.acquisition_1 }}" \
            --acquisition "${{ steps.collect.outputs.acquisition_2 }}"
      - name: Publicar dados organizados por seção e turno
        uses: actions/upload-artifact@v4
        with:
          name: dados-piloto-dois-turnos-${{ inputs.uf }}-${{ inputs.municipio }}-${{ inputs.zona }}-${{ inputs.secao }}
          path: dados/${{ steps.collect.outputs.section_key }}/
          if-no-files-found: error
          retention-days: 90
