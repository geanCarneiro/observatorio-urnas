name: Coleta por abrangência

on:
  workflow_dispatch:
    inputs:
      operacao:
        description: Nova coleta ou retomada de uma execução anterior
        type: choice
        required: true
        default: nova
        options: [nova, retomar]
      run_id_origem:
        description: ID da execução original (obrigatório para retomar)
        type: string
        required: false
        default: ''
      turno:
        description: Turno eleitoral a coletar
        type: choice
        required: true
        default: '2'
        options: ['1', '2', ambos]
      uf:
        description: UFs separadas por vírgula (vazio para todas as UFs e exterior)
        type: string
        required: false
        default: ''
      municipio:
        description: Códigos TSE de municípios separados por vírgula (exige UF)
        type: string
        required: false
        default: ''
      zona:
        description: Zonas separadas por vírgula, mantendo zeros à esquerda (exige município)
        type: string
        required: false
        default: ''
      secao:
        description: Seções separadas por vírgula, mantendo zeros à esquerda (exige zona)
        type: string
        required: false
        default: ''
      offset:
        description: Posição inicial no inventário filtrado
        type: number
        required: true
        default: 0
      max_secoes:
        description: Máximo opcional por turno; vazio coleta toda a abrangência selecionada
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  preparar-e-orquestrar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Validar parâmetros da nova coleta
        if: ${{ inputs.operacao == 'nova' }}
        env:
          LIMIT: ${{ inputs.max_secoes }}
          OFFSET: ${{ inputs.offset }}
        run: |
          python - <<'PY'
          import os
          offset = int(os.environ['OFFSET'])
          limit = os.environ['LIMIT'].strip()
          if offset < 0:
              raise SystemExit('offset não pode ser negativo')
          if limit and int(limit) < 1:
              raise SystemExit('max_secoes precisa ser positivo quando informado')
          PY
      - name: Validar ID da execução a retomar
        if: ${{ inputs.operacao == 'retomar' }}
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id_origem }}
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch(r'[0-9]+', os.environ['SOURCE_RUN_ID']):
              raise SystemExit('informe run_id_origem numérico para retomar')
          PY
      - name: Descobrir inventário completo da abrangência
        if: ${{ inputs.operacao == 'nova' }}
        env:
          TURNO: ${{ inputs.turno }}
          UF: ${{ inputs.uf }}
          MUNICIPIO: ${{ inputs.municipio }}
          ZONA: ${{ inputs.zona }}
          SECAO: ${{ inputs.secao }}
          LIMIT: ${{ inputs.max_secoes }}
          OFFSET: ${{ inputs.offset }}
        run: |
          if [[ "$TURNO" == "ambos" ]]; then TURNOS=(1 2); else TURNOS=("$TURNO"); fi
          for TURNO_ATUAL in "${TURNOS[@]}"; do
            if [[ "$TURNO_ATUAL" == 1 ]]; then CONFIG_ID=3220; else CONFIG_ID=3221; fi
            DEST="inventario/turno${TURNO_ATUAL}"
            ARGS=(--config-id "$CONFIG_ID" --offset "$OFFSET" --output "$DEST")
            if [[ -n "$LIMIT" ]]; then ARGS+=(--limit "$LIMIT"); fi
            if [[ -n "$UF" ]]; then ARGS+=(--uf "$UF"); fi
            if [[ -n "$MUNICIPIO" ]]; then ARGS+=(--municipio "$MUNICIPIO"); fi
            if [[ -n "$ZONA" ]]; then ARGS+=(--zona "$ZONA"); fi
            if [[ -n "$SECAO" ]]; then ARGS+=(--secao "$SECAO"); fi
            python tools/discover_sections.py "${ARGS[@]}" > /dev/null
          done
          if [[ "$TURNO" == "ambos" ]]; then TURNOS_CSV=1,2; else TURNOS_CSV="$TURNO"; fi
          python tools/plan_collection.py --inventory-dir inventario --turns "$TURNOS_CSV" \
            --batch-size 1000 --jobs-per-worker 100 --output coleta-plan.json
      - name: Publicar plano imutável da coleta
        if: ${{ inputs.operacao == 'nova' }}
        uses: actions/upload-artifact@v4
        with:
          name: coleta-plano-${{ github.run_id }}
          path: |
            coleta-plan.json
            inventario/
          if-no-files-found: error
          retention-days: 90
      - name: Baixar índice da execução original
        if: ${{ inputs.operacao == 'retomar' }}
        uses: actions/download-artifact@v4
        with:
          name: coleta-index-${{ inputs.run_id_origem }}
          run-id: ${{ inputs.run_id_origem }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: resume-source
      - name: Baixar plano original da execução
        if: ${{ inputs.operacao == 'retomar' }}
        uses: actions/download-artifact@v4
        with:
          name: coleta-plano-${{ inputs.run_id_origem }}
          run-id: ${{ inputs.run_id_origem }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: resume-source-plan
      - name: Copiar índice para esta retomada
        if: ${{ inputs.operacao == 'retomar' }}
        run: cp resume-source/coleta-index.json coleta-index.json
      - name: Disparar worker runs da nova coleta
        id: dispatch
        if: ${{ inputs.operacao == 'nova' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/orchestrate_collection.py dispatch --plan coleta-plan.json \
            --parent-run-id "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" --index coleta-index.json
      - name: Retomar somente os worker jobs falhados
        id: resume
        if: ${{ inputs.operacao == 'retomar' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/orchestrate_collection.py resume --index coleta-index.json \
          --plan resume-source-plan/coleta-plan.json --repo "$GITHUB_REPOSITORY"
      - name: Publicar índice de execução e workers
        if: ${{ always() && hashFiles('coleta-index.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coleta-index-${{ github.run_id }}
          path: coleta-index.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Reportar falha ao disparar workers
        if: ${{ always() && steps.dispatch.outcome == 'failure' }}
        run: exit 1
      - name: Reportar falha ao retomar workers
        if: ${{ always() && steps.resume.outcome == 'failure' }}
        run: exit 1
