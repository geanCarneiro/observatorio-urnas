name: Coleta por abrangência

on:
  workflow_dispatch:
    inputs:
      turno:
        description: Turno eleitoral a coletar
        type: choice
        required: true
        default: '2'
        options:
          - '1'
          - '2'
          - ambos
      uf:
        description: UF (vazio para todas as UFs e exterior)
        type: string
        required: false
        default: ''
      municipio:
        description: Código TSE do município (opcional)
        type: string
        required: false
        default: ''
      zona:
        description: Zona (opcional; mantenha zeros à esquerda)
        type: string
        required: false
        default: ''
      secao:
        description: Seção (opcional; mantenha zeros à esquerda)
        type: string
        required: false
        default: ''
      max_secoes:
        description: Máximo de seções a coletar nesta execução (1 a 100)
        type: string
        required: true
        default: '10'
      cortes_horarios:
        description: Cortes HH:MM separados por vírgula (escala bruta do log)
        type: string
        required: true
        default: '17:00,17:15,17:30,17:45,18:00,18:30,19:00'

permissions:
  contents: read

concurrency:
  group: coleta-abrangencia-${{ inputs.turno }}-${{ inputs.uf || 'br' }}-${{ inputs.municipio || 'todos' }}-${{ inputs.zona || 'todas' }}-${{ inputs.secao || 'todas' }}
  cancel-in-progress: false

jobs:
  descobrir-e-coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar limite da execução
        env:
          LIMIT: ${{ inputs.max_secoes }}
        run: |
          python - <<'PY'
          import os
          limit=int(os.environ['LIMIT'])
          if not 1 <= limit <= 100: raise SystemExit('max_secoes precisa estar entre 1 e 100')
          PY
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Descobrir seções e aplicar filtros territoriais por turno
        env:
          TURNO: ${{ inputs.turno }}
          UF: ${{ inputs.uf }}
          MUNICIPIO: ${{ inputs.municipio }}
          ZONA: ${{ inputs.zona }}
          SECAO: ${{ inputs.secao }}
          LIMIT: ${{ inputs.max_secoes }}
        run: |
          if [[ "$TURNO" == "ambos" ]]; then TURNOS=(1 2); else TURNOS=("$TURNO"); fi
          for TURNO_ATUAL in "${TURNOS[@]}"; do
            if [[ "$TURNO_ATUAL" == 1 ]]; then CONFIG_ID=3220; else CONFIG_ID=3221; fi
            DEST="inventario/turno${TURNO_ATUAL}"
            ARGS=(--config-id "$CONFIG_ID" --offset 0 --limit "$LIMIT" --output "$DEST")
            if [[ -n "$UF" ]]; then ARGS+=(--uf "$UF"); fi
            if [[ -n "$MUNICIPIO" ]]; then ARGS+=(--municipio "$MUNICIPIO"); fi
            if [[ -n "$ZONA" ]]; then ARGS+=(--zona "$ZONA"); fi
            if [[ -n "$SECAO" ]]; then ARGS+=(--secao "$SECAO"); fi
            python tools/discover_sections.py "${ARGS[@]}" > "$RUNNER_TEMP/inventory-summary-${TURNO_ATUAL}.json"
            python - "$RUNNER_TEMP/inventory-summary-${TURNO_ATUAL}.json" "$TURNO_ATUAL" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          x=json.load(open(sys.argv[1]))
          print(f"### Inventário do turno {sys.argv[2]}")
          print(f"Status: **{x['status']}**; correspondências: **{x['matching_section_count']}**; nesta execução: **{x['selection']['selected_count']}**.")
          print(f"Filtros: `{json.dumps(x['filters'], ensure_ascii=False)}`.")
          if x['selection']['next_offset'] is not None:
              print('O limite do lote foi atingido; refine o filtro geográfico para continuar por uma parte menor do inventário.')
          PY
          done
      - name: Coletar arquivos oficiais separados por turno
        env:
          TURNO: ${{ inputs.turno }}
        run: |
          if [[ "$TURNO" == "ambos" ]]; then TURNOS=(1 2); else TURNOS=("$TURNO"); fi
          mkdir -p dados reports
          for TURNO_ATUAL in "${TURNOS[@]}"; do
            if [[ "$TURNO_ATUAL" == 1 ]]; then DATA_ID=3220; else DATA_ID=3221; fi
            python tools/collect_sections.py \
              --sections "inventario/turno${TURNO_ATUAL}/section-inventory.json" \
              --data-id "$DATA_ID" --output "dados/turno${TURNO_ATUAL}" \
              --report "reports/coleta-turno${TURNO_ATUAL}.json"
          done
      - name: Analisar cada seção e consolidar diagnósticos
        env:
          CORTES: ${{ inputs.cortes_horarios }}
        run: |
          ARGS=()
          while IFS= read -r collection; do ARGS+=(--collection "$collection"); done < <(find dados -name collection.json -type f | sort)
          if ((${#ARGS[@]})); then
            CUT_ARGS=()
            IFS=',' read -ra CUTS <<< "$CORTES"
            for cut in "${CUTS[@]}"; do CUT_ARGS+=(--cut "$cut"); done
            python tools/analyze_sections.py "${ARGS[@]}" --output-dir reports/analises "${CUT_ARGS[@]}"
          else
            python - <<'PY'
          import json, pathlib
          p=pathlib.Path('reports/analises'); p.mkdir(parents=True, exist_ok=True)
          (p/'diagnosticos-consolidados.json').write_text(json.dumps({'report_type':'consolidated_diagnostics','section_count':0,'sections':[],'diagnostics':[],'diagnostics_summary':{'diagnostic_count':0}}, indent=2)+'\n')
          PY
          fi
      - name: Publicar inventário, originais e relatórios
        uses: actions/upload-artifact@v4
        with:
          name: coleta-turno-${{ inputs.turno }}-${{ inputs.uf || 'br' }}-${{ inputs.municipio || 'todos' }}-${{ inputs.zona || 'todas' }}-${{ inputs.secao || 'todas' }}
          path: |
            inventario/
            dados/
            reports/
          if-no-files-found: error
          retention-days: 90
